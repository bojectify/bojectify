# dev service — always present. When there is no dev server (app port =
# "none"), DROP ports, extra_hosts, and env_file — see
# examples/bare/docker-compose.yml. DROP networks too only if there are also
# no sidecars selected (the true `bare`/sso shape). If a sidecar is chosen,
# keep `networks: [internal]` even with no dev server. Keep the rest.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    networks:
      - internal
    ports:
      - '127.0.0.1:__APP_PORT__:__APP_PORT__' # dev server
      - '127.0.0.1:__SB_PORT__:__SB_PORT__' # Storybook — drop if no Storybook
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file:
      - .env
    environment:
      GIT_OPTIONAL_LOCKS: '0' # read-only .git mount: keep optional refresh locks off
      LEFTHOOK: '0' # hooks are a host concern; .git is read-only in-container
      # >>> dev-env: service URLs (REDIS_URL / DATABASE_URL / MEILI_URL) appended here
    volumes:
      - .:/workspace:cached
      - ./.git:/workspace/.git:ro # read-only: a compromised dep cannot rewrite history
      - pnpm-store:/pnpm-store
      # >>> dev-volumes: playwright-cache appended here when browser testing is enabled
    # >>> dev-depends: a depends_on: block appended here when sidecars exist
