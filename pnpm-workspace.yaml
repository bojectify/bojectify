packages:
  - 'packages/*'

# Security overrides — force patched versions of transitive dependencies that
# Dependabot can't bump in place (the parents cap them below the fix, so its
# security-update jobs report "update_not_possible"). Bounded to the current
# major to avoid surprise breaking bumps. See issue #27. Revisit when the
# offending direct deps (storybook / nx / babel) catch up and these become
# redundant. pnpm 11 reads `overrides` here, not in package.json.
# (vite dropped from the overrides in #46 — `nx migrate` moved it to 8.x, which
# is past the security floor, so the cap was made redundant.)
overrides:
  '@babel/core': '>=7.29.6 <8'
  '@babel/plugin-transform-modules-systemjs': '>=7.29.4 <8'
  esbuild: '>=0.28.1 <0.29'
  fast-uri: '>=3.1.2 <4'
  follow-redirects: '>=1.16.0 <2'
  form-data: '>=4.0.6 <5'
  js-yaml: '>=4.2.0 <5'
  lodash: '>=4.18.0 <5'
  'picomatch@<2.3.2': '2.3.2'
  'picomatch@>=4.0.0 <4.0.4': '4.0.4'
  postcss: '>=8.5.10 <9'
  qs: '>=6.15.2 <7'
  tmp: '>=0.2.7 <0.3'
  undici: '>=7.28.0 <8'
  uuid: '>=11.1.1 <12'
  # GHSA-96hv-2xvq-fx4p / CVE-2026-48779 (high: memory-exhaustion DoS). Pulled
  # in transitively (dev-only) via @vitest/browser, which caps it below 8.21.0,
  # so Dependabot reports "update_not_possible". Floor at the patched 8.21.0.
  ws: '>=8.21.0 <9'

onlyBuiltDependencies:
  - lefthook

# Supply-chain hardening: refuse to install any dependency version published
# less than this many minutes ago, giving time for malicious releases to be
# caught and pulled. pnpm 11 defaults to 1440 (24h); we extend it to 3 days.
minimumReleaseAge: 4320

# Explicitly approve which dependency install scripts may run (supply-chain
# control). Only lefthook needs to (it installs git hooks); the rest ship
# prebuilt binaries and run fine with their scripts skipped.
allowBuilds:
  '@swc/core': false
  esbuild: false
  lefthook: true
  nx: false
